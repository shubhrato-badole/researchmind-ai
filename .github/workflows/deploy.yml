name: ResearchMind AI CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.14"   # adjust to match your actual Python version
  NODE_VERSION: "20"
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}-frontend

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend   # adjust if your backend folder is named differently
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check .

      - name: Run tests
        run: |
          pip install pytest
          pytest --tb=short

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend   # adjust if your frontend folder is named differently
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

  build-scan-push:
    needs: [backend-checks, frontend-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image (local only, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Build frontend image (local only, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Push backend image
        run: |
          docker push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker tag ${{ env.BACKEND_IMAGE }}:${{ github.sha }} ${{ env.BACKEND_IMAGE }}:latest
          docker push ${{ env.BACKEND_IMAGE }}:latest

      - name: Push frontend image
        run: |
          docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          docker tag ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} ${{ env.FRONTEND_IMAGE }}:latest
          docker push ${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    needs: build-scan-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy with version tracking + automatic rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -e
            cd ~/researchmind-ai   # adjust to your actual project directory on EC2

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Save current version as previous, before deploying the new one
            if [ -f .current_version ]; then
              cp .current_version .previous_version
            fi

            NEW_VERSION=${{ github.sha }}
            echo "$NEW_VERSION" > .current_version

            export IMAGE_TAG=$NEW_VERSION
            docker compose pull
            docker compose up -d
            docker image prune -f

            # Check the new version is actually healthy
            HEALTHY=false
            for i in $(seq 1 10); do
              if curl -sf http://localhost:8000/health/ready; then
                HEALTHY=true
                break
              fi
              echo "Waiting for service..."
              sleep 10
            done

            if [ "$HEALTHY" = false ]; then
              echo "New version unhealthy — rolling back"
              if [ -f .previous_version ]; then
                PREV=$(cat .previous_version)
                export IMAGE_TAG=$PREV
                docker compose pull
                docker compose up -d
                echo "$PREV" > .current_version
                echo "Rolled back to $PREV"
              else
                echo "No previous version available to roll back to"
              fi
              exit 1
            fi

            echo "Deploy successful: $NEW_VERSION"

  health-check:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Confirm service is healthy from outside
        run: |
          for i in {1..5}; do
            if curl -sf https://YOUR-DOMAIN-OR-IP/health/ready; then
              echo "Service is healthy"
              exit 0
            fi
            echo "Waiting for service..."
            sleep 10
          done
          echo "External health check failed"
          exit 1